<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1522" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Sound / Conversation Wave Gradient (Cyan) -->
    <linearGradient id="flowCyan" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Work / Commitment Flow Gradient (Emerald) -->
    <linearGradient id="flowEmerald" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Core Loop Continuous Flow Gradient -->
    <linearGradient id="flowContinuous" x1="15%" y1="20%" x2="85%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern dark squircle backdrop -->
  <rect width="48" height="48" rx="11" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Flow Nodes: Conversation loop on left, Work commitment loop on right -->
  <!-- Left arc / conversation wave -->
  <path
    d="M17 16 C 10 16, 9 32, 17 32 C 22 32, 26 24, 31 24 C 36 24, 39 28, 39 31"
    fill="none"
    stroke="url(#flowContinuous)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Right complementary return arc completing the infinite flow -->
  <path
    d="M31 32 C 38 32, 39 16, 31 16 C 26 16, 22 24, 17 24 C 12 24, 9 20, 9 17"
    fill="none"
    stroke="url(#flowContinuous)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Active AI Meeting Focal Nodes -->
  <circle cx="17" cy="24" r="2.2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="31" cy="24" r="2.2" fill="#34d399" filter="url(#glow)" />
</svg>